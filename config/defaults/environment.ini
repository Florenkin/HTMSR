; HTMSR 依赖环境路径，UTF-8 编码。路径使用 /，不加引号。
; [build] 用于 CMake 配置和编译，修改后必须重新配置、编译；无法改变已编译程序的链接版本。
[build]
; Qt 5 的 CMake 配置目录，必须与编译器、位数和构建类型匹配。
Qt5_DIR=
; OpenCV 的 CMake 配置目录。
OpenCV_DIR=
; Release VTK Qt 的 CMake 配置目录。
VTK_DIR=
; Debug VTK Qt 的配置目录；没有匹配版本时留空，并关闭下面的 Debug 视图开关。
VTK_DIR_DEBUG=
; Eigen 头文件根目录，目录下应包含 Eigen/Core。
HTMSR_EIGEN_INCLUDE_DIR=
; 海康 MVS SDK 根目录，目录下应包含 Development。
HIK_MVS_ROOT=
; 海康相机运行库目录；修改后重新构建会从此处复制运行库。
HIK_MVS_RUNTIME_DIR=
; 可选的额外依赖搜索目录，多个目录用分号分隔；通常留空，软件自动根据上面的路径推导。
CMAKE_PREFIX_PATH=
; 是否编译海康相机支持：true=启用，false=禁用。
HTMSR_ENABLE_HIK_CAMERA=true
; Release 是否启用嵌入式 VTK 点云视图。
HTMSR_ENABLE_VTK_VIEWER=true
; Release 是否要求 VTK 点云视图可用；true 时缺少依赖会使配置失败。
HTMSR_REQUIRE_VTK_VIEWER=true
; Debug 是否启用嵌入式 VTK 视图；当前没有匹配的 Debug VTK Qt，设为 false。
HTMSR_ENABLE_VTK_VIEWER_DEBUG=false
; Debug 是否要求 VTK 视图可用。
HTMSR_REQUIRE_VTK_VIEWER_DEBUG=false

[runtime]
; Qt 插件备用目录；启动时读取，优先使用程序同目录已部署的匹配插件。
qtPluginDirectory=
; 动态加载运行库的补充搜索目录，多个目录用分号分隔；不解决启动前已链接 DLL 缺失的问题。
extraDllDirectories=
