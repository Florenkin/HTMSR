[reconstruction]
; 是否在重建时保存并加载左右激光线预览图。
saveLaserExtractionImages=false
; 中心线算法：0=灰度重心法，1=Steger。
mode=0
; 激光颜色通道：0=红，1=绿，2=蓝，3=灰度。
color=3
; 左图处理区域起点横坐标，单位像素，范围 0～100000。
leftRoiX=0
; 左图处理区域起点纵坐标，单位像素，范围 0～100000。
leftRoiY=0
; 左图处理区域宽度，单位像素，范围 1～100000。
leftRoiW=3072
; 左图处理区域高度，单位像素，范围 1～100000。
leftRoiH=2048
; 右图处理区域起点横坐标，单位像素，范围 0～100000。
rightRoiX=0
; 右图处理区域起点纵坐标，单位像素，范围 0～100000。
rightRoiY=0
; 右图处理区域宽度，单位像素，范围 1～100000。
rightRoiW=3072
; 右图处理区域高度，单位像素，范围 1～100000。
rightRoiH=2048
; 灰度重心法灰度阈值，范围 0～255。
grayThreshold=200
; 激光提取最小灰度，范围 0～255。
minGray=50
; Steger 二值化阈值，范围 0～255。
binaryThreshold=100
; Steger 筛选阈值，范围 0～255。
selectionThreshold=200
; 预估激光条纹宽度，单位像素，范围 0.5～100。
stripeWidth=5
; 是否删除中心线端点：true=删除，false=保留。
removeEndpoints=false
; 每端删除的点数，范围 0～10000。
removeEndpointCount=10
; 双目匹配距离阈值，范围 0.0001～100。
matchDistance=0.5
; 是否筛选 Steger 中心线点：true=筛选，false=保留全部。
filterStegerPoints=true
; 重建图像起始索引；-1 表示不限制。
imageBegin=-1
; 重建图像结束索引；-1 表示不限制。
imageEnd=-1
