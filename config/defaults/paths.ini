[paths]
; 采集和算法结果输出目录；相对路径以项目目录为基准。
outputDirectory=output
; 激光线提取预览图输出目录；相对路径以项目目录为基准。
laserExtractionDirectory=output/LaserExtraction
; 启动时是否恢复输入目录及标定文件：true=恢复，false=保持为空。
restoreInputPaths=true
; 左相机标定图像目录；可留空。
leftCalibration=
; 右相机标定图像目录；可留空。
rightCalibration=
; 左相机重建图像目录；可留空。
leftReconstruction=
; 右相机重建图像目录；可留空。
rightReconstruction=
; 双目标定结果 YML/YAML 路径；可留空。
calibrationFile=
; 运行日志目录；相对路径以 config 目录为基准。
logDirectory=../log
