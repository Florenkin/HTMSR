[acquisition]
; 左右相机曝光时间，单位微秒，范围 1～10000000。
exposureTime=3000
; 重建采集模式：true=硬触发，false=软触发；标定和预览自由取流。
useHardwareTrigger=true
; 相机外部触发线编号，范围 0～5。
triggerSourceLine=5
; 振镜步进角度，单位度，范围 0.01～650.25。
stepAngleDeg=0.02
; 总旋转角度，单位度，范围 0～40；设备协议按整数角度执行。
totalRotationAngleDeg=40
; 正反方向共用扫描速度参数，单位毫秒，范围 1～1000。
speedMs=30
; 左右相机增益，默认 15，必须大于等于 0。
cameraGain=15
; 单次取流超时，单位毫秒，必须大于 0。
grabTimeoutMs=1000
; 振镜串口波特率，默认 115200。
baudRate=115200
; 振镜命令超时，单位毫秒，必须大于 0。
commandTimeoutMs=500
; 控制器同步模式：true=同步，false=异步，与相机触发模式独立。
syncMode=true
; 扫描方向：false=正向，true=反向。
reverseDirection=false
; 振镜抓图间隔，单位毫秒，必须大于 0。
captureIntervalMs=30
; 连续采集等待时间，单位毫秒，必须大于 0。
continuousCaptureWaitMs=30
; 激光占空比，单位百分比，范围 0～100。
laserDuty=100
; 振镜电压范围，单位伏，范围 0～10。
voltageRangeV=7
